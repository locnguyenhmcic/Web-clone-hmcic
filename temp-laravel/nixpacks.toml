[variables]
NIXPACKS_PHP_VERSION = "8.3"
NIXPACKS_NODE_VERSION = "22"

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist",
  "npm ci"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "chmod +x ./scripts/*.sh && case \"${APP_ROLE:-web}\" in web) ./scripts/start-web.sh ;; worker) ./scripts/start-worker.sh ;; scheduler) ./scripts/start-scheduler.sh ;; *) echo \"Unknown APP_ROLE: ${APP_ROLE}\"; exit 1 ;; esac"
